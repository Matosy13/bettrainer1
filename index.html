<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetTrainer Pro — Тренажер ставок</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function BetTrainerApp() {
            const [bank, setBank] = React.useState(100000);
            const [activeTab, setActiveTab] = React.useState('trainer');
            const [bets, setBets] = React.useState([]);
            const [quickSelectionType, setQuickSelectionType] = React.useState('main');
            const [quickStakeName, setQuickStakeName] = React.useState('П1 (Хозяева)');
            const [quickOdds, setQuickOdds] = React.useState('1.85');
            const [matchTitleInput, setMatchTitleInput] = React.useState('Реал Мадрид — Барселона');
            const [parlayBets, setParlayBets] = React.useState([]);
            const [isParlayMode, setIsParlayMode] = React.useState(false);
            const [stakeAmount, setStakeAmount] = React.useState('1000');

            // Загрузка сохраненных данных при старте
            React.useEffect(() => {
                const savedBank = localStorage.getItem('bettrainer_bank');
                const savedBets = localStorage.getItem('bettrainer_bets');
                if (savedBank) setBank(Number(savedBank));
                if (savedBets) {
                    try { setBets(JSON.parse(savedBets)); } catch(e) {}
                }
            }, []);

            // Автосохранение
            React.useEffect(() => {
                localStorage.setItem('bettrainer_bank', bank);
                localStorage.setItem('bettrainer_bets', JSON.stringify(bets));
            }, [bank, bets]);

            // Универсальная функция добавления в экспресс
            const addToParlayCustom = (matchName, selectionName, oddsVal) => {
                const oddsNum = parseFloat(oddsVal);
                if (isNaN(oddsNum) || oddsNum <= 1) {
                    alert('Введите корректный коэффициент больше 1.0!');
                    return;
                }
                const newItem = {
                    id: Date.now() + Math.random(),
                    match: matchName,
                    selection: selectionName,
                    odds: oddsNum
                };
                setParlayBets([...parlayBets, newItem]);
                setIsParlayMode(true);
            };

            const placeBet = () => {
                const amount = parseFloat(stakeAmount);
                if (isNaN(amount) || amount <= 0) {
                    alert('Введите корректную сумму ставки!');
                    return;
                }
                if (amount > bank) {
                    alert('Недостаточно средств на виртуальном балансе!');
                    return;
                }

                if (isParlayMode && parlayBets.length > 0) {
                    const totalOdds = parlayBets.reduce((acc, item) => acc * item.odds, 1);
                    const newBet = {
                        id: Date.now(),
                        type: 'Экспресс',
                        items: [...parlayBets],
                        odds: Number(totalOdds.toFixed(2)),
                        amount: amount,
                        potentialWin: Math.round(amount * totalOdds),
                        status: 'pending',
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    setBank(bank - amount);
                    setBets([newBet, ...bets]);
                    setParlayBets([]);
                    setIsParlayMode(false);
                } else {
                    const oddsNum = parseFloat(quickOdds) || 1.85;
                    const newBet = {
                        id: Date.now(),
                        type: 'Ординар',
                        match: matchTitleInput,
                        selection: quickStakeName,
                        odds: oddsNum,
                        amount: amount,
                        potentialWin: Math.round(amount * oddsNum),
                        status: 'pending',
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    setBank(bank - amount);
                    setBets([newBet, ...bets]);
                }
            };

            const resolveBet = (betId, outcome) => {
                setBets(bets.map(bet => {
                    if (bet.id === betId && bet.status === 'pending') {
                        if (outcome === 'win') {
                            setBank(prev => prev + bet.potentialWin);
                        } else if (outcome === 'return') {
                            setBank(prev => prev + bet.amount);
                        }
                        return { ...bet, status: outcome };
                    }
                    return bet;
                }));
            };

            // Функция удаления ставки (с возвратом суммы на баланс, если она была в игре)
            const deleteBet = (betId) => {
                const betToDelete = bets.find(b => b.id === betId);
                if (betToDelete && betToDelete.status === 'pending') {
                    setBank(prev => prev + betToDelete.amount);
                }
                setBets(bets.filter(b => b.id !== betId));
            };

            const resolveParlayItem = (betId, itemId, itemOutcome) => {
                setBets(bets.map(bet => {
                    if (bet.id === betId && bet.status === 'pending') {
                        const updatedItems = bet.items.map(item => {
                            if (item.id === itemId) {
                                return { ...item, status: itemOutcome };
                            }
                            return item;
                        });

                        const hasLoss = updatedItems.some(i => i.status === 'loss');
                        const allFinished = updatedItems.every(i => i && i.status && i.status !== 'pending');

                        if (hasLoss) {
                            return { ...bet, items: updatedItems, status: 'loss' };
                        } else if (allFinished) {
                            let newOdds = 1;
                            updatedItems.forEach(i => {
                                if (i.status === 'win') newOdds *= i.odds;
                            });
                            const finalWin = Math.round(bet.amount * newOdds);
                            setBank(prev => prev + finalWin);
                            return { ...bet, items: updatedItems, odds: Number(newOdds.toFixed(2)), potentialWin: finalWin, status: 'win' };
                        }

                        return { ...bet, items: updatedItems };
                    }
                    return bet;
                }));
            };

            const totalStaked = bets.reduce((acc, b) => acc + b.amount, 0);
            const totalWon = bets.filter(b => b.status === 'win').reduce((acc, b) => acc + b.potentialWin, 0);
            const netProfit = totalWon - totalStaked;
            const roi = totalStaked > 0 ? ((netProfit / totalStaked) * 100).toFixed(1) : 0;

            return (
                <div className="max-w-6xl mx-auto px-4 py-6">
                    {/* ШАПКА */}
                    <header className="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-emerald-500 text-slate-950 font-black px-2.5 py-1 rounded-lg text-xs uppercase tracking-wider">PRO</span>
                                <h1 className="text-2xl font-black tracking-tight text-white">BetTrainer Pro</h1>
                            </div>
                            <p className="text-slate-400 text-sm mt-1">Тренажер ставок и учета банкролла без риска реальных денег</p>
                        </div>
                        <div className="flex items-center gap-4 bg-slate-950 px-5 py-3 rounded-xl border border-slate-800">
                            <div>
                                <div className="text-xs text-slate-400 uppercase tracking-wider font-semibold">Виртуальный банк</div>
                                <div className="text-2xl font-black text-emerald-400">{bank.toLocaleString()} ₽</div>
                            </div>
                            <button onClick={() => setBank(100000)} className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg text-slate-300 transition">
                                Сбросить
                            </button>
                        </div>
                    </header>

                    {/* НАВИГАЦИЯ */}
                    <div className="flex gap-2 mb-6 border-b border-slate-800 pb-3">
                        <button onClick={() => setActiveTab('trainer')} className={`px-5 py-2.5 rounded-xl font-bold text-sm transition ${activeTab === 'trainer' ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                            🎯 Тренажер и Линия
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`px-5 py-2.5 rounded-xl font-bold text-sm transition ${activeTab === 'history' ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                            📊 Мои ставки ({bets.length})
                        </button>
                    </div>

                    {activeTab === 'trainer' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* ЛЕВАЯ КОЛОНКА */}
                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                    <h2 className="text-lg font-bold text-white mb-4">
                                        ⚡ Конструктор ставки (Свой матч или из линии)
                                    </h2>

                                    {/* ВЫБОР КАТЕГОРИИ */}
                                    <div className="grid grid-cols-4 gap-2 mb-4">
                                        {['main', 'totals', 'handicaps', 'other'].map((type) => {
                                            const labels = { main: 'Основные', totals: 'Тоталы', handicaps: 'Форы', other: 'ОЗ / ИТБ' };
                                            return (
                                                <button key={type} onClick={() => setQuickSelectionType(type)} className={`py-2 px-1 text-xs font-bold rounded-lg transition ${quickSelectionType === type ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                                                    {labels[type]}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* КНОПКИ ИСХОДОВ */}
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-5">
                                        {quickSelectionType === 'main' && [
                                            ['П1 (Хозяева)', '1.85'], ['Ничья (X)', '3.40'], ['П2 (Гости)', '4.20'],
                                            ['1X (Хозяева не проиграют)', '1.25'], ['12 (Без ничьей)', '1.33'], ['X2 (Гости не проиграют)', '1.95']
                                        ].map(([name, odds]) => (
                                            <button key={name} onClick={() => { setQuickStakeName(name); setQuickOdds(odds); }} className={`p-3 rounded-xl border text-left transition ${quickStakeName === name ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                                <div className="text-xs font-medium truncate">{name}</div>
                                                <div className="text-base font-black text-white mt-1">{odds}</div>
                                            </button>
                                        ))}

                                        {quickSelectionType === 'totals' && [
                                            ['ТБ (1.5)', '1.38'], ['ТМ (1.5)', '3.10'],
                                            ['ТБ (2.5)', '1.95'], ['ТМ (2.5)', '1.85'],
                                            ['ТБ (3.5)', '3.40'], ['ТМ (3.5)', '1.32']
                                        ].map(([name, odds]) => (
                                            <button key={name} onClick={() => { setQuickStakeName(name); setQuickOdds(odds); }} className={`p-3 rounded-xl border text-left transition ${quickStakeName === name ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                                <div className="text-xs font-medium truncate">{name}</div>
                                                <div className="text-base font-black text-white mt-1">{odds}</div>
                                            </button>
                                        ))}

                                        {quickSelectionType === 'handicaps' && [
                                            ['Ф1 (0)', '1.42'], ['Ф2 (0)', '2.80'],
                                            ['Ф1 (-1.5)', '3.20'], ['Ф2 (+1.5)', '1.35'],
                                            ['Ф1 (-1)', '2.30'], ['Ф2 (+1)', '1.62']
                                        ].map(([name, odds]) => (
                                            <button key={name} onClick={() => { setQuickStakeName(name); setQuickOdds(odds); }} className={`p-3 rounded-xl border text-left transition ${quickStakeName === name ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                                <div className="text-xs font-medium truncate">{name}</div>
                                                <div className="text-base font-black text-white mt-1">{odds}</div>
                                            </button>
                                        ))}

                                        {quickSelectionType === 'other' && [
                                            ['ОЗ: Да', '1.90'], ['ОЗ: Нет', '1.85'],
                                            ['ИТБ1 (1.5)', '2.05'], ['ИТБ2 (1.5)', '2.40'],
                                            ['Гол в 1 тайме', '1.38'], ['Тотал четный', '1.90']
                                        ].map(([name, odds]) => (
                                            <button key={name} onClick={() => { setQuickStakeName(name); setQuickOdds(odds); }} className={`p-3 rounded-xl border text-left transition ${quickStakeName === name ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                                <div className="text-xs font-medium truncate">{name}</div>
                                                <div className="text-base font-black text-white mt-1">{odds}</div>
                                            </button>
                                        ))}
                                    </div>

                                    {/* ВВОД МАТЧА И КЭФА */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800 items-end">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold mb-1 block">Название матча</label>
                                            <input type="text" value={matchTitleInput} onChange={(e) => setMatchTitleInput(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold mb-1 block">Коэффициент ({quickStakeName})</label>
                                            <input type="number" step="0.01" value={quickOdds} onChange={(e) => setQuickOdds(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm font-bold text-emerald-400 focus:outline-none focus:border-emerald-500" />
                                        </div>
                                        <div>
                                            <button onClick={() => addToParlayCustom(matchTitleInput, quickStakeName, quickOdds)} className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold py-2 px-3 rounded-lg text-xs border border-slate-700 transition">
                                                + Добавить в Экспресс
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* БЫСТРАЯ ЛИНИЯ */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                    <h2 className="text-lg font-bold text-white mb-2">⚽ Быстрая линия (Примеры матчей)</h2>
                                    <p className="text-xs text-slate-400 mb-4">Нажмите на любой коэффициент или добавьте матч в экспресс:</p>
                                    <div className="space-y-3">
                                        {[
                                            { match: 'Реал Мадрид — Барселона', p1: '1.95', x: '3.50', p2: '3.80' },
                                            { match: 'Манчестер Сити — Ливерпуль', p1: '2.05', x: '3.40', p2: '3.55' },
                                            { match: 'ПСЖ — Марсель', p1: '1.65', x: '4.00', p2: '5.00' }
                                        ].map((m) => (
                                            <div key={m.match} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-3">
                                                <div className="font-semibold text-sm text-slate-200">{m.match}</div>
                                                <div className="flex items-center gap-2 w-full md:w-auto">
                                                    <button onClick={() => { setMatchTitleInput(m.match); setQuickStakeName('П1'); setQuickOdds(m.p1); }} className="bg-slate-900 hover:bg-slate-800 px-3 py-2 rounded-lg text-xs border border-slate-800 text-center">
                                                        <span className="text-slate-400 block text-[10px]">П1</span>
                                                        <span className="font-bold text-emerald-400">{m.p1}</span>
                                                    </button>
                                                    <button onClick={() => { setMatchTitleInput(m.match); setQuickStakeName('Ничья'); setQuickOdds(m.x); }} className="bg-slate-900 hover:bg-slate-800 px-3 py-2 rounded-lg text-xs border border-slate-800 text-center">
                                                        <span className="text-slate-400 block text-[10px]">X</span>
                                                        <span className="font-bold text-emerald-400">{m.x}</span>
                                                    </button>
                                                    <button onClick={() => { setMatchTitleInput(m.match); setQuickStakeName('П2'); setQuickOdds(m.p2); }} className="bg-slate-900 hover:bg-slate-800 px-3 py-2 rounded-lg text-xs border border-slate-800 text-center">
                                                        <span className="text-slate-400 block text-[10px]">П2</span>
                                                        <span className="font-bold text-emerald-400">{m.p2}</span>
                                                    </button>
                                                    <button onClick={() => addToParlayCustom(m.match, 'П1', m.p1)} className="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 font-bold px-3 py-2 rounded-lg text-xs transition border border-emerald-500/30">
                                                        + Экспресс
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* ПРАВАЯ КОЛОНКА: КУПОН СТАВОК */}
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg sticky top-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-white">🎟️ Купон ставки</h2>
                                        <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                                            <button onClick={() => setIsParlayMode(false)} className={`px-3 py-1 rounded-md text-xs font-bold transition ${!isParlayMode ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Ординар</button>
                                            <button onClick={() => setIsParlayMode(true)} className={`px-3 py-1 rounded-md text-xs font-bold transition ${isParlayMode ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Экспресс ({parlayBets.length})</button>
                                        </div>
                                    </div>

                                    {isParlayMode ? (
                                        <div className="space-y-3 mb-4">
                                            {parlayBets.length === 0 ? (
                                                <div className="text-center py-6 text-slate-500 text-sm bg-slate-950 rounded-xl border border-dashed border-slate-800">
                                                    Нажимайте «+ Добавить в Экспресс» у любого матча сверху
                                                </div>
                                            ) : (
                                                parlayBets.map((item) => (
                                                    <div key={item.id} className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                                                        <div>
                                                            <div className="text-slate-400">{item.match}</div>
                                                            <div className="font-bold text-white">{item.selection}</div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="font-black text-emerald-400">{item.odds}</span>
                                                            <button onClick={() => setParlayBets(parlayBets.filter(i => i.id !== item.id))} className="text-red-400 hover:text-red-300 font-bold text-sm">×</button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    ) : (
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4 space-y-2">
                                            <div className="text-xs text-slate-400">{matchTitleInput}</div>
                                            <div className="font-bold text-sm text-white flex justify-between">
                                                <span>{quickStakeName}</span>
                                                <span className="text-emerald-400 font-black">{quickOdds}</span>
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-slate-400 font-semibold mb-1 block">Сумма ставки (₽)</label>
                                            <input type="number" value={stakeAmount} onChange={(e) => setStakeAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-lg font-black text-white focus:outline-none focus:border-emerald-500" />
                                            <div className="flex gap-2 mt-2">
                                                {[500, 1000, 5000, 10000].map(val => (
                                                    <button key={val} onClick={() => setStakeAmount(val.toString())} className="flex-1 bg-slate-800 hover:bg-slate-700 text-xs py-1.5 rounded-lg text-slate-300 font-semibold">
                                                        {val} ₽
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-400">Общий кэф:</span>
                                                <span className="font-black text-white">
                                                    {isParlayMode ? parlayBets.reduce((a, b) => a * b.odds, 1).toFixed(2) : quickOdds}
                                                </span>
                                            </div>
                                            <div className="flex justify-between text-sm">
                                                <span className="text-slate-400">Возможный выигрыш:</span>
                                                <span className="font-black text-emerald-400">
                                                    {Math.round(parseFloat(stakeAmount || 0) * (isParlayMode ? parlayBets.reduce((a, b) => a * b.odds, 1) : parseFloat(quickOdds || 0))).toLocaleString()} ₽
                                                </span>
                                            </div>
                                        </div>

                                        <button onClick={placeBet} className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 uppercase tracking-wider text-sm">
                                            Сделать ставку
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* ИСТОРИЯ СТАВОК */
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                    <div className="text-xs text-slate-400">Всего ставок</div>
                                    <div className="text-xl font-black text-white">{bets.length}</div>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                    <div className="text-xs text-slate-400">Сумма ставок</div>
                                    <div className="text-xl font-black text-white">{totalStaked.toLocaleString()} ₽</div>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                    <div className="text-xs text-slate-400">Чистая прибыль</div>
                                    <div className={`text-xl font-black ${netProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{netProfit.toLocaleString()} ₽</div>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                                    <div className="text-xs text-slate-400">ROI (Доходность)</div>
                                    <div className={`text-xl font-black ${roi >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{roi}%</div>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                <h2 className="text-lg font-bold text-white mb-4">📋 История ваших пари</h2>
                                {bets.length === 0 ? (
                                    <div className="text-center py-12 text-slate-500">У вас пока нет сделанных ставок. Заключите первое пари в тренажере!</div>
                                ) : (
                                    <div className="space-y-4">
                                        {bets.map(bet => (
                                            <div key={bet.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded">{bet.type}</span>
                                                        <span className="text-xs text-slate-500">{bet.date}</span>
                                                        <span className={`text-xs font-bold px-2 py-0.5 rounded ${bet.status === 'win' ? 'bg-emerald-500/20 text-emerald-400' : bet.status === 'loss' ? 'bg-red-500/20 text-red-400' : bet.status === 'return' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-blue-500/20 text-blue-400'}`}>
                                                            {bet.status === 'win' ? 'Выигрыш ✅' : bet.status === 'loss' ? 'Проигрыш ❌' : bet.status === 'return' ? 'Возврат 🔄' : 'В игре ⏳'}
                                                        </span>
                                                    </div>

                                                    {bet.type === 'Экспресс' ? (
                                                        <div className="space-y-1 my-2">
                                                            {bet.items.map(item => (
                                                                <div key={item.id} className="text-xs flex items-center justify-between gap-4 bg-slate-900 px-3 py-1.5 rounded border border-slate-800">
                                                                    <div><span className="text-slate-400">{item.match}</span> — <strong className="text-white">{item.selection}</strong> ({item.odds})</div>
                                                                    {bet.status === 'pending' && (
                                                                        <div className="flex gap-1">
                                                                            <button onClick={() => resolveParlayItem(bet.id, item.id, 'win')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded text-[10px]">✅</button>
                                                                            <button onClick={() => resolveParlayItem(bet.id, item.id, 'loss')} className="bg-red-600 hover:bg-red-500 text-white px-2 py-0.5 rounded text-[10px]">❌</button>
                                                                            <button onClick={() => resolveParlayItem(bet.id, item.id, 'return')} className="bg-yellow-600 hover:bg-yellow-500 text-white px-2 py-0.5 rounded text-[10px]">🔄</button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <div className="font-bold text-sm text-white">{bet.match} — {bet.selection} <span className="text-emerald-400">({bet.odds})</span></div>
                                                    )}

                                                    <div className="text-xs text-slate-400 mt-1">Сумма: <strong className="text-white">{bet.amount.toLocaleString()} ₽</strong> | Кэф: <strong className="text-white">{bet.odds}</strong> | Выигрыш: <strong className="text-emerald-400">{bet.potentialWin.toLocaleString()} ₽</strong></div>
                                                </div>

                                                <div className="flex items-center gap-2 w-full md:w-auto">
                                                    {bet.status === 'pending' && (
                                                        <>
                                                            <button onClick={() => resolveBet(bet.id, 'win')} className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition">Прошло ✅</button>
                                                            <button onClick={() => resolveBet(bet.id, 'loss')} className="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition">Мимо ❌</button>
                                                            <button onClick={() => resolveBet(bet.id, 'return')} className="bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition">Возврат 🔄</button>
                                                        </>
                                                    )}
                                                    {/* Кнопка удаления ставки */}
                                                    <button onClick={() => deleteBet(bet.id)} className="bg-slate-800 hover:bg-red-600/30 hover:border-red-500 text-slate-400 hover:text-red-300 px-3 py-2 rounded-lg text-xs font-bold transition border border-slate-700" title="Удалить ставку">
                                                        🗑️ Удалить
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<BetTrainerApp />);
    </script>
</body>
</html>
